<section class="taxonomy-page">
  {% if taxonomy.name %}
  <h1 class="taxonomy-title">{{ taxonomy.name }}</h1>
  {% endif %}

  {% if taxonomy.terms %}
  <ul class="term-cloud">
    {% for term in taxonomy.terms %}
    <li><a href="{{ term.url }}" class="term-link">{{ term.name }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
</section>
