<article>
  <header>
    <a href="/">← Home</a>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  {% if page.toc %}
  <nav aria-label="Table of contents">
    <ol>
      {% for heading in page.toc %}
      <li><a href="#{{ heading.id }}">{{ heading.text }}</a></li>
      {% endfor %}
    </ol>
  </nav>
  {% endif %}
  <div>{{ page.body_html | safe }}</div>
</article>
