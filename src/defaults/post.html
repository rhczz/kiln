<article>
  <header>
    <a href="/">← Home</a>
    <h1>{{ page.title }}</h1>
    {% if page.iso_date %}<time datetime="{{ page.iso_date }}">{{ page.long_date }}</time>{% endif %}
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    {% if page.tags %}
    <p>{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</p>
    {% endif %}
  </header>
  <div>{{ page.body_html | safe }}</div>
</article>
