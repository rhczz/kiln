<article>
  <p><a href="/docs/">Docs</a></p>
  <h1>{{ page.title }}</h1>
  {% if page.toc %}
  <nav aria-label="Table of contents">
    {% for heading in page.toc %}
    <a href="#{{ heading.id }}">{{ heading.text }}</a>{% if not loop.last %}<br>{% endif %}
    {% endfor %}
  </nav>
  {% endif %}
  {{ page.body_html | safe }}
</article>
