<section class="hero">
  <h1>{{ site.title }}</h1>
  <p>{{ site.subtitle }}</p>
  <p>{{ site.description }}</p>
</section>

{% if archive %}
<section class="projects">
  {% for year in archive %}
    {% for project in year.posts %}
    <article class="project">
      <h2><a href="{{ project.url }}">{{ project.title }}</a></h2>
      <p>{{ project.description }}</p>
    </article>
    {% endfor %}
  {% endfor %}
</section>
{% endif %}
