[package]
name = "kiln"
version = "0.1.0"
edition = "2021"
description = "A lean static site compiler that bakes Markdown into HTML"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
comrak = "0.24"
tera = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tiny_http = "0.12"
notify = "6"
serde_json = "1"
sha2 = "0.10"
