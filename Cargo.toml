[package]
description = "A lean static site compiler that bakes Markdown into HTML"
edition = "2021"
name = "kiln"
version = "1.0.0"

[dependencies]
anyhow = "1"
chrono = {version = "0.4", features = ["serde"]}
clap = {version = "4", features = ["derive"]}
comrak = "0.24"
glob = "0.3"
notify = "6"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tera = "1"
tiny_http = "0.12"
tokio = {version = "1", features = ["rt-multi-thread"]}
toml = "0.8"

[dev-dependencies]
insta = "1"
